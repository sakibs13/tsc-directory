name: Auto Crawl 155 TSC Websites

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual 1-click run from GitHub Actions tab

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Crawler & Update Data
        run: |
          python crawler_v2.py

      - name: Commit and Push if changes detected
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add www/data/tsc_data.json www/data/tsc_data.js www/data/notices_data.json www/data/notices_data.js tsc_directory_app.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Weekly Update: Fresh data from 155 TSC websites" && git push)
