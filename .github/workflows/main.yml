name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-detect files if in subfolder
        run: |
          if [ ! -f "package.json" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "package.json" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ]; then
              echo "Found in $SUBDIR, copying to root..."
              cp -r $SUBDIR/* .
            fi
          fi
          ls -la

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate Official Release Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias tsc-release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "tsc2026sakib" -keypass "tsc2026sakib" \
            -dname "CN=Md. Nazmus Sakib, OU=Technical Education, O=Bangladesh Govt TSC, L=Hajiganj, ST=Chandpur, C=BD"

      - name: Build Release APK and App Bundle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Sign Release APK with Official Keystore
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS"
          
          # Zipalign the release APK
          $BUILD_TOOLS/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          
          # Sign with apksigner (V1 + V2 + V3 signatures)
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:tsc2026sakib --ks-key-alias tsc-release --key-pass pass:tsc2026sakib --out Bangladesh-TSC-Directory-v1.0-Signed.apk aligned.apk
          
          # Verify signature
          $BUILD_TOOLS/apksigner verify --verbose Bangladesh-TSC-Directory-v1.0-Signed.apk
          
          # Sign AAB bundle for Play Store
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass tsc2026sakib android/app/build/outputs/bundle/release/app-release.aab tsc-release
          cp android/app/build/outputs/bundle/release/app-release.aab Bangladesh-TSC-Directory-v1.0-PlayStore.aab

      - name: Upload Signed Official Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Bangladesh-TSC-Directory-Signed-Release-APK
          path: Bangladesh-TSC-Directory-v1.0-Signed.apk

      - name: Upload Play Store App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Bangladesh-TSC-Directory-PlayStore-AAB
          path: Bangladesh-TSC-Directory-v1.0-PlayStore.aab
