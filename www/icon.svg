<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Inner circular badge -->
  <circle cx="256" cy="230" r="140" fill="#ffffff" opacity="0.15" filter="url(#shadow)"/>
  
  <!-- Building / Institution Icon -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Roof / Triangle -->
    <path d="M 256 120 L 130 190 L 382 190 Z"/>
    
    <!-- Top arch header -->
    <rect x="140" y="195" width="232" height="18" rx="4"/>
    
    <!-- Columns -->
    <rect x="160" y="222" width="24" height="100" rx="4"/>
    <rect x="210" y="222" width="24" height="100" rx="4"/>
    <rect x="278" y="222" width="24" height="100" rx="4"/>
    <rect x="328" y="222" width="24" height="100" rx="4"/>
    
    <!-- Base steps -->
    <rect x="130" y="328" width="252" height="16" rx="4"/>
    <rect x="110" y="348" width="292" height="18" rx="6"/>
  </g>
  
  <!-- Bangla Banner / Text Pill -->
  <rect x="96" y="396" width="320" height="58" rx="29" fill="#ffffff" filter="url(#shadow)"/>
  <text x="256" y="435" font-family="'Hind Siliguri', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f766e" text-anchor="middle">১৫৫ টিএসসি ডিরেক্টরি</text>
</svg>
